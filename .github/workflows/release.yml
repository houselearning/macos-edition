name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release (for example: v1.0.0)"
        required: true
        default: "v1.0.0"

jobs:
  build-and-release:
    runs-on: macos-14
    permissions:
      contents: write

    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
      APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_KEY_P8: ${{ secrets.APPLE_KEY_P8 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release signing credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in APPLE_SIGNING_IDENTITY APPLE_TEAM_ID APPLE_KEY_ID APPLE_ISSUER_ID APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_KEY_P8 KEYCHAIN_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          done

      - name: Prepare signing keychain and Apple API key
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/houselearning-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/HouseLearningSigningCert.p12"
          security import "$RUNNER_TEMP/HouseLearningSigningCert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -T /usr/bin/codesign

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$RUNNER_TEMP/apple-auth"
          printf '%s' "$APPLE_KEY_P8" > "$RUNNER_TEMP/apple-auth/AuthKey_${APPLE_KEY_ID}.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple-auth/AuthKey_${APPLE_KEY_ID}.p8" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build signed macOS release artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/package-release.sh

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            build-release/HouseLearning-macOS-universal-v${{ steps.version.outputs.version }}.app.zip
            build-release/HouseLearning-macOS-universal-v${{ steps.version.outputs.version }}.dmg
          generate_release_notes: true
